<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carnatic Raga Sequence Visualizer</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --panel-bg: #fff;
            --border-color: #ddd;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            height: 100vh;
            box-sizing: border-box;
        }

        /* Left Panel - Big List */
        .left-panel {
            flex: 0 0 450px;
            background: var(--panel-bg);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }

        .right-panel {
            flex: 1;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7f8c8d;
            font-size: 1.2em;
        }

        h2 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; }

        /* Accordion Structure */
        .mela-group {
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }

        .mela-header {
            background: #ecf0f1;
            padding: 10px 15px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            transition: background 0.2s;
        }

        .mela-header:hover { background: #e0e6e8; }
        .mela-title { font-size: 1.05em; color: #2980b9; margin-bottom: 5px; }
        
        .janya-container {
            display: none;
            background: #fff;
            padding: 10px;
            border-top: 1px solid var(--border-color);
        }

        .janya-item {
            padding: 8px;
            border-bottom: 1px dashed #eee;
            display: flex;
            flex-direction: column;
        }
        .janya-item:last-child { border-bottom: none; }
        .janya-title { font-size: 0.95em; font-weight: bold; color: #d35400; margin-bottom: 4px; }

        /* Swara Sequence Highlighting (Pills) */
        .sequence-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 4px;
            font-size: 0.75em; /* Small text requirement */
        }
        
        .seq-label {
            font-weight: bold;
            color: #7f8c8d;
            margin-right: 8px;
            width: 35px;
        }

        .swara {
            display: inline-block;
            padding: 2px 5px;
            margin: 2px 1px;
            border-radius: 4px;
            font-weight: bold;
            font-family: monospace;
            border: 1px solid rgba(0,0,0,0.1);
        }

        /* Color Coding by Base Note */
        .s-S { background: #e0e0e0; color: #333; }
        .s-R { background: #ffcdd2; color: #b71c1c; } /* Reds */
        .s-G { background: #ffe0b2; color: #e65100; } /* Oranges */
        .s-M { background: #c8e6c9; color: #1b5e20; } /* Greens */
        .s-P { background: #bbdefb; color: #0d47a1; } /* Blues */
        .s-D { background: #e1bee7; color: #4a148c; } /* Purples */
        .s-N { background: #f8bbd0; color: #880e4f; } /* Pinks */

    </style>
</head>

        let ragasDB = {};

        // Parse Text into HTML format with colored swaras
        function formatSequence(rawSequence) {
            // Regex to extract valid swaras (even if squished together without spaces)
            const regex = /(S'|R[1-3]'?|G[1-3]'?|M[1-2]'?|P'?|D[1-3]'?|N[1-3]'?|S\.|R[1-3]\.|G[1-3]\.|M[1-2]\.|P\.|D[1-3]\.|N[1-3]\.|S|R|G|M|P|D|N)/g;
            const matches = rawSequence.match(regex);
            
            if (!matches) return rawSequence;
            
            return matches.map(swara => {
                const baseNote = swara[0]; // Extracts the first letter (S, R, G, etc.)
                return `<span class="swara s-${baseNote}">${swara}</span>`;
            }).join('');
        }

        // Initialize and Build
        function buildLibrary() {
            // Parse Melas
            melaData.trim().split('\n').forEach(line => {
                let parts = line.split('|').map(s => s.trim());
                if(parts.length === 4) {
                    let [num, name, aro, ava] = parts;
                    ragasDB[num] = { num, name, aro, ava, janyas: [] };
                }
            });

            // Parse Janyas
            janyaData.trim().split('\n').forEach(line => {
                let parts = line.split('|').map(s => s.trim());
                if(parts.length === 4) {
                    let [name, melaNum, aro, ava] = parts;
                    if (ragasDB[melaNum]) {
                        ragasDB[melaNum].janyas.push({ name, aro, ava });
                    }
                }
            });

            // Render to DOM
            const container = document.getElementById('raga-list');
            
            Object.keys(ragasDB).forEach(key => {
                const mela = ragasDB[key];
                
                const groupDiv = document.createElement('div');
                groupDiv.className = 'mela-group';
                
                // Mela Header
                const headerDiv = document.createElement('div');
                headerDiv.className = 'mela-header';
                headerDiv.onclick = function() {
                    const jContainer = this.nextElementSibling;
                    jContainer.style.display = jContainer.style.display === 'block' ? 'none' : 'block';
                };

                headerDiv.innerHTML = `
                    <div class="mela-title">${mela.num}. ${mela.name}</div>
                    <div class="sequence-row"><span class="seq-label">Aro:</span> ${formatSequence(mela.aro)}</div>
                    <div class="sequence-row"><span class="seq-label">Ava:</span> ${formatSequence(mela.ava)}</div>
                `;
                
                // Janya Container
                const janyaDiv = document.createElement('div');
                janyaDiv.className = 'janya-container';
                
                if (mela.janyas.length === 0) {
                    janyaDiv.innerHTML = '<div style="font-size:0.8em; color:#95a5a6; padding: 5px;">No Janya ragas listed.</div>';
                } else {
                    mela.janyas.forEach(janya => {
                        const jItem = document.createElement('div');
                        jItem.className = 'janya-item';
                        jItem.innerHTML = `
                            <div class="janya-title">&#8618; ${janya.name}</div>
                            <div class="sequence-row"><span class="seq-label">Aro:</span> ${formatSequence(janya.aro)}</div>
                            <div class="sequence-row"><span class="seq-label">Ava:</span> ${formatSequence(janya.ava)}</div>
                        `;
                        janyaDiv.appendChild(jItem);
                    });
                }

                groupDiv.appendChild(headerDiv);
                groupDiv.appendChild(janyaDiv);
                container.appendChild(groupDiv);
            });
        }

        buildLibrary();
    </script>
