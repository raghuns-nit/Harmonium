<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carnatic Raga Visualizer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg-color: #f4f7f6; --text-color: #333; --panel-bg: #fff; --border-color: #ddd; --color-1: #e74c3c; --color-2: #3498db; --color-3: #2ecc71; }
        body { font-family: sans-serif; background-color: var(--bg-color); margin: 0; padding: 15px; display: flex; flex-direction: column; height: 100vh; gap: 15px; box-sizing: border-box; }
        @media (min-width: 800px) { body { flex-direction: row; } }
        .left-panel { flex: 0 0 350px; background: var(--panel-bg); padding: 15px; border-radius: 8px; overflow-y: auto; border: 1px solid var(--border-color); }
        .right-panel { flex: 1; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
        .mela-group { margin-bottom: 5px; border: 1px solid var(--border-color); border-radius: 4px; }
        .mela-header { background: #ecf0f1; padding: 8px; cursor: pointer; font-size: 0.9em; font-weight: bold; color: #2980b9; }
        .janya-container { display: none; padding: 5px; border-top: 1px solid #eee; }
        .janya-item { padding: 4px; font-size: 0.8em; color: #d35400; cursor: pointer; }
        .controls { display: flex; gap: 5px; flex-wrap: wrap; background: #fff; padding: 10px; border-radius: 8px; }
        button { padding: 6px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.8em; }
        .tile { background: #fff; border: 1px solid #bdc3c7; padding: 5px; text-align: center; cursor: pointer; font-size: 0.7em; }
        .chart-container { background: #fff; padding: 10px; border-radius: 8px; flex: 1; min-height: 250px; }
    </style>
</head>
<body>
    <div class="left-panel">
        <h2>Raga Library</h2>
        <div id="raga-list"></div>
    </div>
    <div class="right-panel">
        <div class="controls">
            <button onclick="toggleCompareMode()">Compare</button>
            <button onclick="resetSelection()">Reset</button>
            <button onclick="toggleViewMode()">12/22 Notes</button>
            <label><input type="checkbox" id="hoverAudioToggle" checked> Audio</label>
        </div>
        <div class="grid-container">
            <h3 id="grid-title" style="font-size: 0.9em;">Shruti Map</h3>
            <div id="swara-grid" style="display:grid; grid-template-columns: repeat(7, 1fr); gap: 4px;"></div>
        </div>
        <div class="chart-container">
            <canvas id="ragaChart"></canvas>
        </div>
    </div>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx, audioBuffer = null, activeNodes = {};
        const BASE_FREQ = 261.63;
        let viewMode = '22', isCompareMode = false, selectedRagas = [], ragaChart = null;

        // --- ROBUST PARSING ENGINE ---
        const carnaticToShruti = { 'S': 1, 'R1': 3, 'R2': 5, 'R3': 7, 'G1': 5, 'G2': 7, 'G3': 8, 'M1': 10, 'M2': 12, 'P': 14, 'D1': 16, 'D2': 18, 'D3': 20, 'N1': 18, 'N2': 20, 'N3': 21 };
        
        function fixHighSa(swaraStr, isArohana) {
            if (!swaraStr) return "";
            const regex = /(S'|R[1-3]'?|G[1-3]'?|M[1-2]'?|P'?|D[1-3]'?|N[1-3]'?|S\.|R[1-3]\.|G[1-3]\.|M[1-2]\.|P\.|D[1-3]\.|N[1-3]\.|S|R|G|M|P|D|N)/g;
            let matches = swaraStr.match(regex);
            if (!matches) return swaraStr;
            if (isArohana && matches[matches.length - 1] === 'S') matches[matches.length - 1] = "S'";
            if (!isArohana && matches[0] === 'S') matches[0] = "S'";
            return matches.join(' ');
        }

        async function init() {
            try {
                // Initialize Data
                await loadDatabase(); 
                renderSidebar();
                renderGrid();
                initChart();
                // Audio
                audioCtx = new AudioContext();
                const response = await fetch('harmonium-kannan-orig.wav');
                if(response.ok) audioBuffer = await audioCtx.decodeAudioData(await response.arrayBuffer());
            } catch (e) { console.error("Initialization error:", e); }
        }

        // Add your previous loadDatabase/render/helper functions here...
        // ... (Keep your existing helper functions from the last script here) ...

        window.onload = init;
    </script>
</body>
</html>
