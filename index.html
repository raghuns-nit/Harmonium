<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carnatic Harmonium</title>
    <style>
        body { font-family: sans-serif; background-color: #fcfaf2; color: #333; max-width: 900px; margin: 0 auto; padding: 20px; text-align: center; }
        .panel { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; text-align: left; }
        .input-group { position: relative; margin-top: 10px; }
        input[type="text"] { padding: 10px 30px 10px 10px; font-size: 16px; width: 100%; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
        .clear-btn { position: absolute; right: 10px; top: 10px; cursor: pointer; color: #888; font-weight: bold; }
        button { padding: 10px 20px; font-size: 16px; background-color: #d35400; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Carnatic Harmonium</h2>
    
    <div class="panel">
        <label><b>1. Select mElakartha rAgA:</b></label>
        <div class="input-group">
            <input type="text" id="melaInput" list="melaList" placeholder="Search mElakartha..." onchange="onMelaSelect()">
            <span class="clear-btn" onclick="clearInput('melaInput')">✕</span>
        </div>
        <datalist id="melaList"></datalist>

        <label style="margin-top:15px; display:block;"><b>2. Select janya rAgA:</b></label>
        <div class="input-group">
            <input type="text" id="janyaInput" list="janyaList" placeholder="Search janya rAgA..." onchange="onJanyaSelect()">
            <span class="clear-btn" onclick="clearInput('janyaInput')">✕</span>
        </div>
        <datalist id="janyaList"></datalist>
    </div>

    <script>
        let melakartaRagas = {};
        
        // --- 1. DATA PARSING ---
        function fixHighSa(swaraStr, isArohana) {
            if (!swaraStr) return "";
            const regex = /(S'|R[1-3]'?|G[1-3]'?|M[1-2]'?|P'?|D[1-3]'?|N[1-3]'?|S\.|R[1-3]\.|G[1-3]\.|M[1-2]\.|P\.|D[1-3]\.|N[1-3]\.|S|R|G|M|P|D|N)/g;
            let matches = swaraStr.match(regex);
            if (!matches) return swaraStr;
            if (isArohana && matches[matches.length - 1] === 'S') matches[matches.length - 1] = "S'";
            if (!isArohana && matches[0] === 'S') matches[0] = "S'";
            return matches.join(' ');
        }

        async function loadDatabase() {
            // (Note: Paste your melaRaw and janyaRaw string data here as used in previous code)
            // ... (I have omitted the 900+ lines for space, ensure they are present here) ...
            
            // Logic to populate the datalist
            const melaList = document.getElementById('melaList');
            Object.keys(melakartaRagas).forEach(num => {
                let opt = document.createElement('option');
                opt.value = `${num} - ${melakartaRagas[num].name}`;
                melaList.appendChild(opt);
            });
        }

        // --- 2. UI HELPERS ---
        function clearInput(id) {
            document.getElementById(id).value = '';
            if(id === 'melaInput') {
                document.getElementById('janyaInput').value = '';
                document.getElementById('janyaList').innerHTML = '';
            }
            // Add your logic here to stop audio/clear keyboard if needed
        }

        function onMelaSelect() {
            const val = document.getElementById('melaInput').value;
            if(!val) return;
            // ... (Your existing Raga selection logic)
        }

        function onJanyaSelect() {
            const val = document.getElementById('janyaInput').value;
            if(!val) return;
            // ... (Your existing Janya selection logic)
        }

        window.onload = loadDatabase;
    </script>
</body>
</html>
