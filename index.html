<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Carnatic Harmonium</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fcfaf2;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        h2 { color: #d35400; margin-bottom: 5px; }
        .status-bar { font-size: 0.9em; font-weight: bold; color: #e67e22; margin-bottom: 20px; }
        .panel {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            text-align: left;
        }
        input[type="text"], input[type="file"] {
            padding: 10px;
            font-size: 16px;
            margin-top: 10px;
            width: 100%;
            border-radius: 4px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #d35400;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #e67e22; }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        .note { font-size: 0.9em; color: #7f8c8d; margin-bottom: 5px; }
        
        .toggle-btn { background-color: #2980b9; width: 100%; font-weight: bold; }

        /* Few Keys (Raga Specific Layout) */
        .keys-few {
            display: flex;
            justify-content: center;
            gap: 5px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        .key-few {
            padding: 15px 10px;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            background-color: #ecf0f1;
            flex: 1 1 10%;
            min-width: 45px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            user-select: none;
            touch-action: none;
        }
        .key-few:active, .key-few.active { background-color: #e67e22; color: white; }

        /* 3-Octave Full Keyboard Layout */
        .keys-full-wrapper {
            display: none; 
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
            border: 2px solid #333;
            border-radius: 4px;
            background: #222;
        }
        .keys-full {
            display: flex;
            position: relative;
            height: 180px;
            width: 1050px; /* Wide enough for 3 octaves (21 white keys * 50px) */
        }
        .key-white {
            width: 50px;
            height: 100%;
            background: white;
            border: 1px solid #333;
            box-sizing: border-box;
            position: relative;
            cursor: pointer;
            touch-action: none;
            border-radius: 0 0 4px 4px;
            flex-shrink: 0;
        }
        .key-black {
            position: absolute;
            width: 30px;
            height: 60%;
            background: black;
            color: white;
            z-index: 2;
            top: 0;
            cursor: pointer;
            touch-action: none;
            border-radius: 0 0 4px 4px;
            text-align: center;
            font-size: 0.7em;
            padding-top: 10px;
        }
        .key-white.active { background: #e67e22; }
        .key-black.active { background: #d35400; }
        .key-label { position: absolute; bottom: 10px; width: 100%; text-align: center; font-weight: bold; font-size: 0.8em; color: #555; pointer-events: none;}

        textarea {
            width: 100%;
            height: 120px;
            margin-top: 10px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            resize: vertical;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <h2>Ultimate Carnatic Harmonium</h2>
    <div class="status-bar" id="audioStatus">Loading harmonium-kannan-orig.wav in background...</div>

    <div class="panel">
        <label><b>1. Select Raga:</b></label>
        <p class="note">Search for a Melakarta or Janya raga. Arohana & Avarohana will populate automatically.</p>
        <input type="text" id="ragaSearch" list="ragaList" placeholder="Type to search ragas (e.g., Kalyani, Mohanam)..." onchange="selectRaga()">
        <datalist id="ragaList"></datalist>
        
        <button class="toggle-btn" onclick="toggleKeyboard()">Toggle: Raga Swaras (7 keys) / 3-Octave Harmonium</button>

        <!-- 7-Key Raga Layout -->
        <div class="keys-few" id="fewKeysContainer"></div>

        <!-- 3-Octave Piano Layout -->
        <div class="keys-full-wrapper" id="fullKeysContainer">
            <div class="keys-full" id="pianoScrollArea">
                <!-- Javascript will inject 3 octaves here -->
            </div>
        </div>
    </div>
    
    <div class="panel">
        <label><b>2. Auto-Play Notation File:</b></label>
        <p class="note">Upload a .txt file or modify the text below. Plays based on the selected Raga.</p>
        <input type="file" id="notationUpload" accept=".txt">
        <textarea id="notationInput">S R G M P D N S'
S' N D P M G R S</textarea>
        <button id="playBtn" onclick="playNotation()">Play Notation</button>
    </div>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let audioBuffer = null;
        let activeNodes = {};

        // Base 12 Semitones mapping for absolute calculation
        const swaraToSemitone = {
            'S': 0, 'R1': 1, 'R2': 2, 'R3': 3, 'G1': 2, 'G2': 3, 'G3': 4,
            'M1': 5, 'M2': 6, 'P': 7, 'D1': 8, 'D2': 9, 'D3': 10,
            'N1': 9, 'N2': 10, 'N3': 11
        };

        let ragas = {}; // Will hold all generated and manual ragas
        let activeScale = [];

        // 1. GENERATE 72 MELAKARTAS
        const melakartaNames = [
            "Kanakangi", "Ratnangi", "Ganamurti", "Vanaspati", "Manavati", "Tanarupi", "Senavati", "Hanumatodi", "Dhenuka", "Natakapriya", "Kokilapriya", "Rupavati",
            "Gayakapriya", "Vakulabharanam", "Mayamalavagowla", "Chakravakam", "Suryakantam", "Hatakambari", "Jhankaradhvani", "Natabhairavi", "Keeravani", "Kharaharapriya", "Gourimanohari", "Varunapriya",
            "Mararanjani", "Charukesi", "Sarasangi", "Harikambhoji", "Dheerasankarabharanam", "Naganandini", "Yagapriya", "Ragavardhini", "Gangeyabhushani", "Vagadheeswari", "Shulini", "Chalanata",
            "Salagam", "Jalarnavam", "Jhalavarali", "Navaneetam", "Pavani", "Raghupriya", "Gavambodhi", "Bhavapriya", "Shubhapantuvarali", "Shadvidamargini", "Suvarnangi", "Divyamani",
            "Dhavalambari", "Namanarayani", "Kamavardhani", "Ramapriya", "Gamanashrama", "Vishwambari", "Shamalangi", "Shanmukhapriya", "Simhendramadhyamam", "Hemavati", "Dharmavati", "Neetimati",
            "Kantamani", "Rishabhapriya", "Latangi", "Vachaspati", "Mechakalyani", "Chitrambari", "Sucharitra", "Jyoti Swarupini", "Dhatuvardhani", "Nasikabhushani", "Kosalam", "Rasikapriya"
        ];
        
        const purvanga = [['R1','G1'], ['R1','G2'], ['R1','G3'], ['R2','G2'], ['R2','G3'], ['R3','G3']];
        const uttaranga = [['D1','N1'], ['D1','N2'], ['D1','N3'], ['D2','N2'], ['D2','N3'], ['D3','N3']];

        melakartaNames.forEach((name, index) => {
            let M = index < 36 ? 'M1' : 'M2';
            let p = Math.floor((index % 36) / 6);
            let u = (index % 36) % 6;
            let aro = `S ${purvanga[p][0]} ${purvanga[p][1]} ${M} P ${uttaranga[u][0]} ${uttaranga[u][1]} S'`;
            let ava = `S' ${uttaranga[u][1]} ${uttaranga[u][0]} P ${M} ${purvanga[p][1]} ${purvanga[p][0]} S`;
            ragas[name] = { aro, ava };
        });

        // 2. ADD POPULAR JANYA RAGAS (Manodharma / Concert Favorites)
        const janyaRagas = {
            "Mohanam": { aro: "S R2 G3 P D2 S'", ava: "S' D2 P G3 R2 S" },
            "Hamsadhvani": { aro: "S R2 G3 P N3 S'", ava: "S' N3 P G3 R2 S" },
            "Hindolam": { aro: "S G2 M1 D1 N2 S'", ava: "S' N2 D1 M1 G2 S" },
            "Kambhoji": { aro: "S R2 G3 M1 P D2 S'", ava: "S' N2 D2 P M1 G3 R2 S" },
            "Vasantha": { aro: "S G3 M1 D2 N3 S'", ava: "S' N3 D2 M1 G3 R1 S" },
            "Madhyamavati": { aro: "S R2 M1 P N2 S'", ava: "S' N2 P M1 R2 S" },
            "Abhogi": { aro: "S R2 G2 M1 D2 S'", ava: "S' D2 M1 G2 R2 S" },
            "Bhairavi": { aro: "S R2 G2 M1 P D2 N2 S'", ava: "S' N2 D1 P M1 G2 R2 S" },
            "Anandabhairavi": { aro: "S G2 R2 G2 M1 P D2 P S'", ava: "S' N2 D2 P M1 G2 R2 S" },
            "Sriranjani": { aro: "S R2 G2 M1 D2 N2 S'", ava: "S' N2 D2 M1 G2 R2 S" }
        };
        Object.assign(ragas, janyaRagas);

        // Populate Datalist
        const dataList = document.getElementById('ragaList');
        Object.keys(ragas).sort().forEach(name => {
            let option = document.createElement('option');
            option.value = name;
            dataList.appendChild(option);
        });

        // 3. BACKGROUND AUDIO LOADING
        window.addEventListener('DOMContentLoaded', async () => {
            audioCtx = new AudioContext();
            build3OctaveKeyboard();
            try {
                const response = await fetch('harmonium-kannan-orig.wav');
                if (!response.ok) throw new Error("File not found");
                const arrayBuffer = await response.arrayBuffer();
                audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                
                document.getElementById('audioStatus').innerHTML = "Audio Loaded & Ready! &#9989;";
                document.getElementById('audioStatus').style.color = "#27ae60";
                
                // Set default Raga
                document.getElementById('ragaSearch').value = "Mayamalavagowla";
                selectRaga();
                
            } catch (err) {
                document.getElementById('audioStatus').innerText = "Error: harmonium-kannan-orig.wav not found in directory.";
                document.getElementById('audioStatus').style.color = "#c0392b";
            }
        });

        // Browsers require interaction to resume AudioContext
        document.body.addEventListener('click', () => { 
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); 
        });

        function toggleKeyboard() {
            const full = document.getElementById('fullKeysContainer');
            const few = document.getElementById('fewKeysContainer');
            if (full.style.display === 'block') {
                full.style.display = 'none';
                few.style.display = 'flex';
            } else {
                full.style.display = 'block';
                few.style.display = 'none';
                // Auto scroll to middle octave
                full.scrollLeft = 250;
            }
        }

        function selectRaga() {
            const ragaName = document.getElementById('ragaSearch').value;
            if (ragas[ragaName]) {
                const aro = ragas[ragaName].aro;
                const ava = ragas[ragaName].ava;
                document.getElementById('notationInput').value = `${aro}\n${ava}`;
                
                // Extract just the unique swaras from Arohana to build the 7-key layout
                activeScale = aro.replace(/S'/g, '').trim().split(' ');
                activeScale.push("S'"); // Ensure high Sa is at the end
                
                buildFewKeys();
            }
        }

        // Build the Raga-Specific 7-8 keys
        function buildFewKeys() {
            const container = document.getElementById('fewKeysContainer');
            container.innerHTML = '';
            
            // Map physical row to whatever the scale length is (QWERTY row)
            const fallbackKeys = ['e','r','t','y','u','i','o','p','[',']'];

            activeScale.forEach((swara, index) => {
                let btn = document.createElement('div');
                btn.className = 'key-few';
                let triggerKey = fallbackKeys[index] || '';
                
                btn.innerHTML = `${swara}<br>(${triggerKey})`;
                
                let baseSwara = swara.replace("'", "");
                let octaveOffset = swara.includes("'") ? 12 : 0;
                let semitone = swaraToSemitone[baseSwara] + octaveOffset;

                btn.onmousedown = () => startNote(semitone, btn);
                btn.onmouseup = () => stopNote(semitone, btn);
                btn.onmouseleave = () => stopNote(semitone, btn);
                btn.ontouchstart = (e) => { e.preventDefault(); startNote(semitone, btn); };
                btn.ontouchend = () => stopNote(semitone, btn);
                
                container.appendChild(btn);
            });
        }

        // Build the 3-Octave Harmonium Layout (Mandra, Madhya, Tara)
        function build3OctaveKeyboard() {
            const container = document.getElementById('pianoScrollArea');
            const octaves = [
                { label: 'Mandra', offset: -12 }, 
                { label: 'Madhya', offset: 0 }, 
                { label: 'Tara', offset: 12 }
            ];
            const pattern = [
                { type: 'white', swara: 'S', offset: 0 },
                { type: 'black', swara: 'r1', offset: 1, left: '35px' },
                { type: 'white', swara: 'R2', offset: 2 },
                { type: 'black', swara: 'g2', offset: 3, left: '85px' },
                { type: 'white', swara: 'G3', offset: 4 },
                { type: 'white', swara: 'M1', offset: 5 },
                { type: 'black', swara: 'm2', offset: 6, left: '185px' },
                { type: 'white', swara: 'P', offset: 7 },
                { type: 'black', swara: 'd1', offset: 8, left: '285px' },
                { type: 'white', swara: 'D2', offset: 9 },
                { type: 'black', swara: 'n2', offset: 10, left: '335px' },
                { type: 'white', swara: 'N3', offset: 11 }
            ];

            let absoluteLeft = 0;

            octaves.forEach((oct, octIndex) => {
                let whiteKeyCount = 0;
                pattern.forEach((keyDef) => {
                    let btn = document.createElement('div');
                    let semitone = keyDef.offset + oct.offset;
                    
                    if (keyDef.type === 'white') {
                        btn.className = 'key-white';
                        btn.innerHTML = `<div class="key-label">${keyDef.swara}<br>${octIndex === 1 ? '' : oct.label[0]}</div>`;
                        container.appendChild(btn);
                        absoluteLeft += 50;
                        whiteKeyCount++;
                    } else {
                        btn.className = 'key-black';
                        btn.innerHTML = keyDef.swara;
                        // Calculate black key position relative to total width so far
                        btn.style.left = `${absoluteLeft - 15}px`;
                        container.appendChild(btn);
                    }

                    btn.onmousedown = () => startNote(semitone, btn);
                    btn.onmouseup = () => stopNote(semitone, btn);
                    btn.onmouseleave = () => stopNote(semitone, btn);
                    btn.ontouchstart = (e) => { e.preventDefault(); startNote(semitone, btn); };
                    btn.ontouchend = () => stopNote(semitone, btn);
                });
            });
            
            // Add final High Sa for the 3rd octave
            let finalBtn = document.createElement('div');
            finalBtn.className = 'key-white';
            finalBtn.innerHTML = `<div class="key-label">S</div>`;
            finalBtn.onmousedown = () => startNote(24, finalBtn);
            finalBtn.onmouseup = () => stopNote(24, finalBtn);
            finalBtn.onmouseleave = () => stopNote(24, finalBtn);
            finalBtn.ontouchstart = (e) => { e.preventDefault(); startNote(24, finalBtn); };
            finalBtn.ontouchend = () => stopNote(24, finalBtn);
            container.appendChild(finalBtn);
        }

        // CORE AUDIO PLAYBACK
        function startNote(semitone, uiElement = null) {
            if (!audioBuffer) return;
            if (activeNodes[semitone]) return;

            const source = audioCtx.createBufferSource();
            const gainNode = audioCtx.createGain();
            
            source.buffer = audioBuffer;
            source.playbackRate.value = Math.pow(2, semitone / 12); // Pitch shift math
            
            source.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            source.start(0);
            activeNodes[semitone] = { source, gainNode };

            if (uiElement) uiElement.classList.add('active');
        }

        function stopNote(semitone, uiElement = null) {
            if (activeNodes[semitone]) {
                const { source, gainNode } = activeNodes[semitone];
                gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.015);
                source.stop(audioCtx.currentTime + 0.1);
                delete activeNodes[semitone];
            }
            if (uiElement) uiElement.classList.remove('active');
        }

        // AUTO-PLAY NOTATION PARSER
        document.getElementById('notationUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) { document.getElementById('notationInput').value = evt.target.result; };
            reader.readAsText(file);
        });

        async function playNotation() {
            if (!audioBuffer) return;
            
            const text = document.getElementById('notationInput').value.toUpperCase();
            // Match any Swara, including Mandra (e.g. S.) and Tara (e.g. S')
            const regex = /\b(S'|R1'|R2'|G2'|G3'|M1'|M2'|P'|D1'|D2'|N2'|N3'|S\.|R1\.|R2\.|G2\.|G3\.|M1\.|M2\.|P\.|D1\.|D2\.|N2\.|N3\.|S|R1|R2|R3|R|G1|G2|G3|G|M1|M2|M|P|D1|D2|D3|D|N1|N2|N3|N)\b/g;
            const rawNotes = text.match(regex); 
            
            if (!rawNotes) { alert("No valid swaras found."); return; }
            
            const playButton = document.getElementById('playBtn');
            playButton.disabled = true;
            playButton.innerText = "Playing...";

            // Map generic notes (R, G, M) to the currently selected raga scale
            const ragaName = document.getElementById('ragaSearch').value;
            let arohanaSwaras = [];
            if (ragas[ragaName]) {
                arohanaSwaras = ragas[ragaName].aro.replace(/S'/g, '').trim().split(' ');
            }

            for (let note of rawNotes) {
                let octaveOffset = 0;
                let baseNote = note;

                if (note.includes("'")) { octaveOffset = 12; baseNote = note.replace("'", ""); }
                if (note.includes(".")) { octaveOffset = -12; baseNote = note.replace(".", ""); }

                // Resolve generic notations to exact scale notes
                if (baseNote === 'R' && arohanaSwaras[1]) baseNote = arohanaSwaras[1];
                if (baseNote === 'G' && arohanaSwaras[2]) baseNote = arohanaSwaras[2];
                if (baseNote === 'M' && arohanaSwaras[3]) baseNote = arohanaSwaras[3];
                if (baseNote === 'D' && arohanaSwaras[5]) baseNote = arohanaSwaras[5];
                if (baseNote === 'N' && arohanaSwaras[6]) baseNote = arohanaSwaras[6];

                let semitone = swaraToSemitone[baseNote] + octaveOffset;
                
                if (!isNaN(semitone)) {
                    startNote(semitone);
                    await new Promise(r => setTimeout(r, 400));
                    stopNote(semitone);
                    await new Promise(r => setTimeout(r, 100));
                }
            }
            playButton.disabled = false;
            playButton.innerText = "Play Notation";
        }
    </script>
</body>
</html>
